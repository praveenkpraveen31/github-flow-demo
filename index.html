<!DOCTYPE html>
<html>
<head>
    <title>GitHub Flow Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Dark mode toggle -->
    <div class="theme-toggle">
        <label for="darkModeToggle">Dark Mode:</label>
        <input type="checkbox" id="darkModeToggle">
    </div>

    <div class="container">
        <h1>Welcome to GitHub Flow Demo</h1>
        <p>This project demonstrates collaborative GitHub workflows.</p>
        <div class="button-group">
            <button onclick="add(5, 3)">Add Numbers</button>
            <button onclick="multiply(4, 7)">Multiply Numbers</button>
        </div>
        <div id="result"></div>
    </div>
    <script src="functions.js"></script>
    <script src="app.js"></script>
</body>
</html>
